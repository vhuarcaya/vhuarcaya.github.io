<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2234"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="8" fill="url(#bg)"/>
  
  <!-- Decorative circles (laser/optics motif) -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="200" r="80" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="200" r="40" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.1"/>
  
  <!-- Person silhouette -->
  <circle cx="200" cy="150" r="50" fill="#64748b" opacity="0.6"/>
  <ellipse cx="200" cy="280" rx="70" ry="50" fill="#64748b" opacity="0.6"/>
  
  <!-- Center dot (laser point) -->
  <circle cx="200" cy="200" r="6" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Text hint -->
  <text x="200" y="370" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">
    Add your photo
  </text>
</svg>
